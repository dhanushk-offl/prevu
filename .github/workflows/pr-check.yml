name: PR Check

on:
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-22.04
            bundles: "appimage,deb"
          - platform: Windows
            os: windows-latest
            bundles: "nsis,msi"
          - platform: macOS
            os: macos-14
            bundles: "app,dmg"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Linux system dependencies (Tauri)
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev \
            libwebkit2gtk-4.1-0 \
            libgtk-3-dev \
            libgtk-3-0 \
            libsoup-3.0-dev \
            libegl1 \
            libgl1 \
            libgl1-mesa-dri \
            libgbm1 \
            libdrm2 \
            xvfb \
            imagemagick

      - name: Install macOS system dependencies
        if: startsWith(matrix.os, 'macos-')
        run: brew install imagemagick

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS cross-compilation target
        if: startsWith(matrix.os, 'macos-')
        run: rustup target add x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            . -> target
          shared-key: pr-${{ matrix.platform }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Normalize Tauri config (remove legacy app.env)
        run: |
          bun -e "const fs=require('fs'); const path='src-tauri/tauri.conf.json'; const config=JSON.parse(fs.readFileSync(path,'utf8')); if (config.app && Object.prototype.hasOwnProperty.call(config.app,'env')) { delete config.app.env; fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n'); console.log('Removed unsupported app.env from tauri.conf.json'); } else { console.log('tauri.conf.json already compatible'); }"

      - name: Generate Tauri icons from logo.png
        run: bun run tauri -- icon logo.png

      - name: Verify icon files
        shell: bash
        run: |
          ls -la src-tauri/icons
          test -f src-tauri/icons/icon.ico
          test -f src-tauri/icons/icon.icns
          test -f src-tauri/icons/128x128.png
          test -f src-tauri/icons/32x32.png

      - name: Build frontend
        run: bun run build

      - name: Build Tauri app
        if: ${{ !startsWith(matrix.os, 'macos-') }}
        run: bun run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Build Tauri app (macOS Apple Silicon + Intel)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            echo "::group::Building $target"
            bun run tauri -- build --target "$target" --bundles ${{ matrix.bundles }}
            echo "::endgroup::"
          done

      - name: Verify macOS produced one DMG per architecture
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          for arch in aarch64 x64; do
            DMG="$(find target -path "*/release/bundle/macos/*.${arch}.dmg" -print -quit || true)"
            if [ -z "$DMG" ]; then
              DMG="$(find target -path '*/release/bundle/macos/*.dmg' -name "*${arch}*" -print -quit || true)"
            fi
            if [ -z "$DMG" ]; then
              echo "::error::No $arch DMG was produced."
              find target -type f -path '*/release/bundle/*' | sort || true
              exit 1
            fi
            echo "Found $arch DMG: $DMG"
          done

      - name: Verify AppImage .DirIcon
        if: matrix.platform == 'Linux'
        run: |
          set -euo pipefail
          APPIMAGE="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          APPIMAGE="$(cd "$(dirname "$APPIMAGE")" && pwd)/$(basename "$APPIMAGE")"
          chmod +x "$APPIMAGE"
          EXTRACT_DIR="$(mktemp -d)"
          cd "$EXTRACT_DIR"
          "$APPIMAGE" --appimage-extract
          if [ ! -e squashfs-root/.DirIcon ]; then
            echo "FATAL: .DirIcon is missing or broken (absolute symlink?)"
            ls -la squashfs-root/
            exit 1
          fi
          TARGET="$(readlink -f squashfs-root/.DirIcon || true)"
          echo ".DirIcon -> $(readlink squashfs-root/.DirIcon || echo '(file)')"
          test -f "$TARGET"
          FILE_TYPE="$(file -b "$TARGET")"
          echo "Detected .DirIcon type: $FILE_TYPE"
          if ! echo "$FILE_TYPE" | grep -qiE 'PNG|JPEG|SVG'; then
            echo "FATAL: .DirIcon must be PNG/JPEG/SVG, got: $FILE_TYPE"
            exit 1
          fi
          echo "AppImage .DirIcon OK"

      - name: Linux runtime smoke test (detect EGL startup crash)
        if: matrix.platform == 'Linux'
        run: |
          set -euo pipefail
          BIN_PATH="target/release/prevu-desktop"
          if [ ! -x "$BIN_PATH" ]; then
            BIN_PATH="target/release/prevu"
          fi
          echo "Testing binary: $BIN_PATH"
          LOG_FILE="$(mktemp)"
          xvfb-run -a sh -c "\"$BIN_PATH\" >\"$LOG_FILE\" 2>&1 & pid=\$!; sleep 6; kill \$pid 2>/dev/null || true; wait \$pid || true"
          if grep -qi "EGL_BAD_PARAMETER" "$LOG_FILE"; then
            echo "Detected EGL_BAD_PARAMETER during startup:"
            cat "$LOG_FILE"
            exit 1
          fi
          echo "No EGL_BAD_PARAMETER detected in startup logs."

      - name: Show bundle outputs
        if: always()
        shell: bash
        run: |
          if find target -type d -path '*/release/bundle' -print -quit 2>/dev/null | grep -q .; then
            find target -type f -path '*/release/bundle/*' | sort
          else
            echo "No bundle directory found"
            exit 1
          fi

  # Single required status check for branch protection.
  # Matrix job names change; this job name stays stable: "PR Check".
  pr-check:
    name: PR Check
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Linux, Windows, and macOS builds
        run: |
          result="${{ needs.build.result }}"
          echo "Matrix build result: ${result}"
          if [ "${result}" != "success" ]; then
            echo "::error::PR Check failed because one or more platform builds did not succeed (Linux, Windows, macOS Apple Silicon + Intel)."
            exit 1
          fi
          echo "All platform builds succeeded."
