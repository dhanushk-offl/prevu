name: Build Desktop Installers

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }} ${{ matrix.arch || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: "nsis,msi"
            artifact_name: prevu-windows-bundles
            artifact_paths: |
              target/release/bundle/**/*.msi
              target/release/bundle/**/*.exe
          - os: macos-14
            arch: arm64
            bundles: "app,dmg"
            artifact_name: prevu-macos-arm64-bundles
            artifact_paths: |
              target/release/bundle/**/*.dmg
              target/release/bundle/macos/**/*.app
              target/release/bundle/macos/**/*.app/**
          - os: macos-13
            arch: x64
            bundles: "app,dmg"
            artifact_name: prevu-macos-x64-bundles
            artifact_paths: |
              target/release/bundle/**/*.dmg
              target/release/bundle/macos/**/*.app
              target/release/bundle/macos/**/*.app/**
          - os: ubuntu-22.04
            bundles: "appimage,deb"
            artifact_name: prevu-linux-bundles
            artifact_paths: |
              target/release/bundle/**/*.AppImage
              target/release/bundle/**/*.deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Linux system dependencies (Tauri)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev \
            libwebkit2gtk-4.1-0 \
            libgtk-3-dev \
            libgtk-3-0 \
            libsoup-3.0-dev \
            libegl1 \
            libgl1 \
            libgl1-mesa-dri \
            libgbm1 \
            libdrm2 \
            xvfb \
            imagemagick

      - name: Install macOS system dependencies
        if: startsWith(matrix.os, 'macos-')
        run: brew install imagemagick

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            . -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Normalize Tauri config (remove legacy app.env)
        run: |
          bun -e "const fs=require('fs'); const path='src-tauri/tauri.conf.json'; const config=JSON.parse(fs.readFileSync(path,'utf8')); if (config.app && Object.prototype.hasOwnProperty.call(config.app,'env')) { delete config.app.env; fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n'); console.log('Removed unsupported app.env from tauri.conf.json'); } else { console.log('tauri.conf.json already compatible'); }"

      - name: Generate Tauri icons from logo.png
        run: bun run tauri -- icon logo.png

      - name: Verify icon files
        shell: bash
        run: |
          ls -la src-tauri/icons
          test -f src-tauri/icons/icon.ico
          test -f src-tauri/icons/icon.icns
          test -f src-tauri/icons/128x128.png
          test -f src-tauri/icons/32x32.png

      - name: Build Tauri app
        run: bun run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Verify AppImage .DirIcon
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          set -euo pipefail
          APPIMAGE="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          APPIMAGE="$(cd "$(dirname "$APPIMAGE")" && pwd)/$(basename "$APPIMAGE")"
          chmod +x "$APPIMAGE"
          EXTRACT_DIR="$(mktemp -d)"
          cd "$EXTRACT_DIR"
          "$APPIMAGE" --appimage-extract
          if [ ! -e squashfs-root/.DirIcon ]; then
            echo "FATAL: .DirIcon is missing or broken (absolute symlink?)"
            ls -la squashfs-root/
            exit 1
          fi
          TARGET="$(readlink -f squashfs-root/.DirIcon || true)"
          echo ".DirIcon -> $(readlink squashfs-root/.DirIcon || echo '(file)')"
          test -f "$TARGET"
          FILE_TYPE="$(file -b "$TARGET")"
          echo "Detected .DirIcon type: $FILE_TYPE"
          if ! echo "$FILE_TYPE" | grep -qiE 'PNG|JPEG|SVG'; then
            echo "FATAL: .DirIcon must be PNG/JPEG/SVG, got: $FILE_TYPE"
            exit 1
          fi
          echo "AppImage .DirIcon OK"

      - name: Linux runtime smoke test (detect EGL startup crash)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          set -euo pipefail
          BIN_PATH="target/release/prevu-desktop"
          if [ ! -x "$BIN_PATH" ]; then
            BIN_PATH="target/release/prevu"
          fi
          echo "Testing binary: $BIN_PATH"
          LOG_FILE="$(mktemp)"
          xvfb-run -a sh -c "\"$BIN_PATH\" >\"$LOG_FILE\" 2>&1 & pid=\$!; sleep 6; kill \$pid 2>/dev/null || true; wait \$pid || true"
          if grep -qi "EGL_BAD_PARAMETER" "$LOG_FILE"; then
            echo "Detected EGL_BAD_PARAMETER during startup:"
            cat "$LOG_FILE"
            exit 1
          fi
          echo "No EGL_BAD_PARAMETER detected in startup logs."

      - name: Show bundle outputs
        if: always()
        shell: bash
        run: |
          if [ -d target/release/bundle ]; then
            find target/release/bundle -type f | sort
          else
            echo "No bundle directory found"
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: ${{ matrix.artifact_paths }}
