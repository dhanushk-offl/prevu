name: Release Desktop Installers

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} ${{ matrix.arch || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: "nsis,msi"
            artifact_name: prevu-windows-bundles
            artifact_paths: |
              target/release/bundle/**/*.msi
              target/release/bundle/**/*.exe
          - os: macos-14
            arch: arm64
            bundles: "app,dmg"
            artifact_name: prevu-macos-arm64-bundles
            artifact_paths: |
              target/release/bundle/**/*.dmg
              target/release/bundle/macos/**/*.app
              target/release/bundle/macos/**/*.app/**
          - os: macos-15-intel
            arch: x64
            bundles: "app,dmg"
            artifact_name: prevu-macos-x64-bundles
            artifact_paths: |
              target/release/bundle/**/*.dmg
              target/release/bundle/macos/**/*.app
              target/release/bundle/macos/**/*.app/**
          - os: ubuntu-22.04
            bundles: "appimage,deb"
            artifact_name: prevu-linux-bundles
            artifact_paths: |
              target/release/bundle/**/*.AppImage
              target/release/bundle/**/*.deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Linux system dependencies (Tauri)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev \
            libwebkit2gtk-4.1-0 \
            libgtk-3-dev \
            libgtk-3-0 \
            libsoup-3.0-dev \
            libegl1 \
            libgl1 \
            libgl1-mesa-dri \
            libgbm1 \
            libdrm2 \
            xvfb \
            imagemagick

      - name: Install macOS system dependencies
        if: startsWith(matrix.os, 'macos-')
        run: brew install imagemagick

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            . -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Normalize Tauri config (remove legacy app.env)
        run: |
          bun -e "const fs=require('fs'); const path='src-tauri/tauri.conf.json'; const config=JSON.parse(fs.readFileSync(path,'utf8')); if (config.app && Object.prototype.hasOwnProperty.call(config.app,'env')) { delete config.app.env; fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n'); console.log('Removed unsupported app.env from tauri.conf.json'); } else { console.log('tauri.conf.json already compatible'); }"

      - name: Generate Tauri icons from logo.png
        run: bun run tauri -- icon logo.png

      - name: Build Tauri app
        run: bun run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Verify AppImage .DirIcon
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          set -euo pipefail
          APPIMAGE="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          APPIMAGE="$(cd "$(dirname "$APPIMAGE")" && pwd)/$(basename "$APPIMAGE")"
          chmod +x "$APPIMAGE"
          EXTRACT_DIR="$(mktemp -d)"
          cd "$EXTRACT_DIR"
          "$APPIMAGE" --appimage-extract
          if [ ! -e squashfs-root/.DirIcon ]; then
            echo "FATAL: .DirIcon is missing or broken (absolute symlink?)"
            ls -la squashfs-root/
            exit 1
          fi
          TARGET="$(readlink -f squashfs-root/.DirIcon || true)"
          echo ".DirIcon -> $(readlink squashfs-root/.DirIcon || echo '(file)')"
          test -f "$TARGET"
          FILE_TYPE="$(file -b "$TARGET")"
          echo "Detected .DirIcon type: $FILE_TYPE"
          if ! echo "$FILE_TYPE" | grep -qiE 'PNG|JPEG|SVG'; then
            echo "FATAL: .DirIcon must be PNG/JPEG/SVG, got: $FILE_TYPE"
            exit 1
          fi
          echo "AppImage .DirIcon OK"

      - name: Linux runtime smoke test (detect EGL startup crash)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          set -euo pipefail
          BIN_PATH="target/release/prevu-desktop"
          if [ ! -x "$BIN_PATH" ]; then
            BIN_PATH="target/release/prevu"
          fi
          echo "Testing binary: $BIN_PATH"
          LOG_FILE="$(mktemp)"
          xvfb-run -a sh -c "\"$BIN_PATH\" >\"$LOG_FILE\" 2>&1 & pid=\$!; sleep 6; kill \$pid 2>/dev/null || true; wait \$pid || true"
          if grep -qi "EGL_BAD_PARAMETER" "$LOG_FILE"; then
            echo "Detected EGL_BAD_PARAMETER during startup:"
            cat "$LOG_FILE"
            exit 1
          fi
          echo "No EGL_BAD_PARAMETER detected in startup logs."

      - name: Upload build artifact (for release job)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ matrix.artifact_paths }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Display downloaded files
        run: find artifacts/ -type f | sort

      - name: Flatten artifacts into release-files/
        run: |
          mkdir -p release-files
          find artifacts/ -type f \( \
            -name "*.exe" \
            -o -name "*.msi" \
            -o -name "*.dmg" \
            -o -name "*.AppImage" \
            -o -name "*.deb" \
          \) -exec cp {} release-files/ \;
          echo "--- Files to be released ---"
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PREVU ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## PREVU ${{ github.ref_name }}

            Catch broken social previews before you ship. Inspects Open Graph and
            Twitter Card metadata on localhost, staging, or production.

            ### Download

            | Platform | File |
            |----------|------|
            | 🪟 Windows | `.exe` (NSIS installer) or `.msi` |
            | 🍎 macOS (Apple Silicon) | `.dmg` — `PREVU_*_aarch64.dmg` |
            | 🍎 macOS (Intel) | `.dmg` — `PREVU_*_x64.dmg` |
            | 🐧 Linux | `.AppImage` or `.deb` (Arch AUR: `yay -S prevu`) |

            Pick the macOS DMG that matches your hardware — Apple Silicon and Intel
            are separate files. If you are unsure, check
            [Apple's guide](https://support.apple.com/en-us/HT210742).

            > **Note:** macOS and Windows builds are not code-signed.
            > You may need to allow the app through Gatekeeper (macOS) or SmartScreen (Windows).

            ### Highlights

            - **macOS Intel builds are now published.** Previously only Apple Silicon
              DMGs were documented, though both architectures have been shipping.
            - **New marketing site.** Features, screenshots, and per-platform download
              links. Download buttons resolve live from the GitHub Releases API, so
              they always point at the latest published build.
            - **Security:** Vite upgraded to 6.4.3 in both the desktop app and the website
              to clear a published advisory.
            - **CI:** cross-platform PR checks are now mandatory, so a broken Windows,
              macOS, or Linux build is caught before merge.

            Full details in [CHANGELOG.md](https://github.com/dhanushk-offl/prevu/blob/${{ github.ref_name }}/CHANGELOG.md).
          files: release-files/*

  update-aur:
    name: Update AUR package
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check AUR secret presence
        id: aur_secret
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "AUR_SSH_PRIVATE_KEY is not set. Skipping AUR update."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.aur_secret.outputs.present == 'true'
        run: |
          set -euo pipefail
          # Do not install docker.io: ubuntu-latest already ships Docker Engine
          # (containerd.io). Installing Ubuntu's docker.io conflicts with it and
          # aborts apt with exit 100. Use the runner-provided docker instead.
          sudo apt-get update
          sudo apt-get install -y git openssh-client
          docker --version

      - name: Setup SSH for AUR
        if: steps.aur_secret.outputs.present == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write via env + strip CR so a mangled multiline secret does not
          # produce "error in libcrypto" when OpenSSH loads the key.
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone AUR repo
        if: steps.aur_secret.outputs.present == 'true'
        run: git clone ssh://aur@aur.archlinux.org/prevu.git aur

      - name: Update PKGBUILD and .SRCINFO
        if: steps.aur_secret.outputs.present == 'true'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          cd aur
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          docker run --rm -v "$PWD:/work" archlinux:latest bash -lc "
            set -euo pipefail
            pacman -Sy --noconfirm base-devel pacman-contrib >/dev/null
            cd /work
            updpkgsums
            makepkg --printsrcinfo > .SRCINFO
          "

      - name: Commit and push update
        if: steps.aur_secret.outputs.present == 'true'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          cd aur
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "update to ${VERSION}" || echo "No changes"
          git push
